<!doctype html><html><head><meta charset="utf-8"><title>Sign in</title>
<style>body{margin:0;font:16px system-ui;background:#eef1f4;display:flex;justify-content:center;padding-top:190px}
.card{background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:28px 32px;width:360px}
h2{margin:0 0 18px} label{display:block;font-size:13px;color:#555;margin:10px 0 4px} input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd;border-radius:6px;font:inherit}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:6px;background:#3a5ba0;color:#fff;font:600 15px system-ui}</style></head>
<body><div class="card"><h2 data-t="h">Sign in to your account</h2><label data-t="u">E-mail</label><input id="user" value="me@example.com"><label data-t="pw">Password</label><input id="pw" type="password"><button data-t="b">Continue</button></div>
<script>const T={vi:{h:'Đăng nhập tài khoản',u:'Email',pw:'Mật khẩu',b:'Tiếp tục'},fr:{h:'Connectez-vous à votre compte',u:'E-mail',pw:'Mot de passe',b:'Continuer'}};
const l=new URLSearchParams(location.search).get('l'); if(T[l]) document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);</script></body></html>

name: build

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: check the pinned EasyList still converts cleanly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Rebuild the bundled lists from the pinned commit and make sure the committed
      # files match: anyone can check the shipped data really comes from EasyList.
      - run: node scripts/build-lists.mjs
      - name: Bundled lists match the pinned EasyList commit
        run: |
          if ! git diff --quiet -- extension/rules extension/data/cosmetic.js; then
            echo "::error::Bundled lists differ from a fresh build. Run 'npm run build:lists' and commit."
            git diff --stat -- extension/rules extension/data/cosmetic.js
            exit 1
          fi
      - run: node scripts/verify.mjs
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm run test:e2e
        timeout-minutes: 5
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: mkdir -p dist && cd extension && zip -qr -X ../dist/ad-tray-chrome.zip . -x '.*'
      - uses: actions/upload-artifact@v5
        with:
          name: ad-tray-chrome
          path: dist/ad-tray-chrome.zip

  # Builds the Safari version on GitHub's macOS machines (they have Xcode), so you
  # don't need Xcode locally. Ad-hoc signed ("Sign to Run Locally"): fine for testing
  # with Safari's "Allow unsigned extensions", not for the App Store.
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/verify.mjs
      - name: Convert to a Safari Web Extension project
        run: |
          xcrun safari-web-extension-converter extension \
            --project-location safari --app-name "Ad Tray" \
            --bundle-identifier fr.thanhhungdoan.adtray \
            --swift --macos-only --copy-resources --no-open --no-prompt --force
          # The converter derives the app's ID from its name (fr.thanhhungdoan.Ad-Tray);
          # the extension's ID must start with the app's, so pin the app to fr.thanhhungdoan.adtray.
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = "fr.thanhhungdoan.Ad-Tray";/PRODUCT_BUNDLE_IDENTIFIER = fr.thanhhungdoan.adtray;/; s/PRODUCT_BUNDLE_IDENTIFIER = fr.thanhhungdoan.Ad-Tray;/PRODUCT_BUNDLE_IDENTIFIER = fr.thanhhungdoan.adtray;/' "safari/Ad Tray/Ad Tray.xcodeproj/project.pbxproj"
          grep -n PRODUCT_BUNDLE_IDENTIFIER "safari/Ad Tray/Ad Tray.xcodeproj/project.pbxproj"
          xcodebuild -list -project "safari/Ad Tray/Ad Tray.xcodeproj"
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project "safari/Ad Tray/Ad Tray.xcodeproj" -scheme "Ad Tray" \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log || {
              grep -E "error:|fatal" xcodebuild.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }
      - name: Sign ad-hoc with the generated entitlements
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Ad Tray.app"
          EXT="$(find "$APP/Contents/PlugIns" -maxdepth 1 -name '*.appex' | head -1)"
          EXT_ENT="$(find safari -name '*.entitlements' -path '*Extension*' | head -1)"
          APP_ENT="$(find safari -name '*.entitlements' ! -path '*Extension*' | head -1)"
          echo "appex=$EXT ext_ent=$EXT_ENT app_ent=$APP_ENT"
          codesign --force --sign - --entitlements "$EXT_ENT" "$EXT"
          codesign --force --sign - --entitlements "$APP_ENT" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Zip the app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/Build/Products/Release/Ad Tray.app" dist/ad-tray-safari.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ad-tray-safari
          path: dist/ad-tray-safari.zip
